<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SuperFinance</title>
<meta name="theme-color" content="#EDEFF2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: misma línea que SuperGym / SuperMeal — título condensado en mayúsculas, tarjetas redondeadas con disco de color y círculo de check, barra de pestañas abajo. Letra y botones más grandes para Mario. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#14161B; --muted:#5A606C; --line:#DCDFE4;
  --accent:#2A55F5; --accent-ink:#FFFFFF; --accent-soft:rgba(42,85,245,.10);
  --good:#0E9F63; --good-soft:rgba(14,159,99,.12); --bad:#D93A3A; --bad-soft:rgba(217,58,58,.10);
  --p-blue:#2F6BFF; --p-red:#E5383B; --p-yellow:#E8AE00; --p-green:#16A34A; --p-pink:#E8458B; --p-orange:#F06A1A; --p-purple:#7C4DFF; --p-teal:#0EA5A4;
  --shadow:0 1px 2px rgba(20,22,27,.06),0 8px 24px rgba(20,22,27,.06);
  --sheet:#FFFFFF; --scrim:rgba(10,12,16,.45); --on-good:#FFFFFF;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D0F12; --surface:#16191E; --surface-2:#1D2127; --ink:#F1F3F6; --muted:#9AA1AD; --line:#282D35;
  --accent:#5C7DFF; --accent-ink:#0B0D12; --accent-soft:rgba(92,125,255,.16);
  --good:#2ED48A; --good-soft:rgba(46,212,138,.14); --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.14);
  --p-blue:#4D82FF; --p-red:#FF5456; --p-yellow:#FFC61A; --p-green:#2BC766; --p-pink:#FF6FAE; --p-orange:#FF8A3D; --p-purple:#9B7BFF; --p-teal:#2DD4CF;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --sheet:#16191E; --scrim:rgba(0,0,0,.6); --on-good:#06140D;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0F12; --surface:#16191E; --surface-2:#1D2127; --ink:#F1F3F6; --muted:#9AA1AD; --line:#282D35;
  --accent:#5C7DFF; --accent-ink:#0B0D12; --accent-soft:rgba(92,125,255,.16);
  --good:#2ED48A; --good-soft:rgba(46,212,138,.14); --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.14);
  --p-blue:#4D82FF; --p-red:#FF5456; --p-yellow:#FFC61A; --p-green:#2BC766; --p-pink:#FF6FAE; --p-orange:#FF8A3D; --p-purple:#9B7BFF; --p-teal:#2DD4CF;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --sheet:#16191E; --scrim:rgba(0,0,0,.6); --on-good:#06140D;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html,body,button,input,label{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-block:14px 130px}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* disco de color con emoji (como los discos de SuperGym) */
.coin{--c:var(--p-blue);width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:26px;line-height:1;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 13%,var(--surface)) 0 60%,var(--c) 61% 71%,color-mix(in srgb,var(--c) 13%,var(--surface)) 72%);}
.coin.lg{width:64px;height:64px;font-size:30px}
.coin.sm{width:40px;height:40px;font-size:19px}

/* barra superior */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink)}
.brand .logo svg{width:21px;height:21px}
.brand .logo.coinlogo{background:none;overflow:hidden}
.brand .logo.coinlogo svg{width:100%;height:100%;display:block}
.brand b{font-family:var(--display);font-size:22px;font-weight:900;font-stretch:80%;text-transform:uppercase;line-height:1}
.brand b em{font-style:normal;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none}
.icon-btn svg{width:21px;height:21px}
@media (max-width:360px){.brand .logo{display:none}}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--good-soft);color:var(--good)}
.sync i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.sync.off{background:var(--surface-2);color:var(--muted)}
.sync.err{background:var(--bad-soft);color:var(--bad)}
@media (max-width:400px){.sync .t{display:none}.sync{padding:0 10px}}

/* saludo + mes */
.hello h1{font-size:clamp(46px,14vw,64px);line-height:.9;font-stretch:72%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.hello h1 em{font-style:normal;color:var(--accent)}
.month{display:flex;align-items:center;gap:8px;margin-top:12px}
.month>button{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.month>button svg{width:20px;height:20px}
.mlbl{flex:1;min-width:0;display:grid;justify-items:center;gap:4px;text-align:center}
.month b{font-family:var(--display);font-weight:800;font-stretch:85%;font-size:22px;text-transform:uppercase}
.bill{font-size:13.5px;line-height:1.3;color:var(--muted)}
.bill b{font-family:var(--body);font-size:13.5px;font-stretch:100%;text-transform:none;font-weight:700;color:var(--ink)}
.bill.none{font-style:italic}
button.bill{display:block;margin:6px auto 0;max-width:100%;position:relative;font-family:var(--body);text-align:center;padding:5px 30px;border-radius:12px;border:1px dashed transparent;cursor:pointer}
button.bill:hover,button.bill:focus-visible{background:var(--surface);border-color:var(--line)}
/* el lápiz va al costado sin mover el texto, así las dos líneas quedan centradas */
.bill .ed{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:22px;height:22px;color:var(--accent)}
.bill .ed svg{width:15px;height:15px}
.warn{font-size:14px;font-weight:600;padding:10px 12px;border-radius:14px;background:var(--bad-soft);color:var(--ink);margin-top:12px}
.month>button:disabled{opacity:.35;cursor:default}
.month .today-pill{white-space:nowrap;display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:3px;font-family:var(--body);text-transform:none}

/* tarjeta principal */
.hero{margin-top:16px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:14px}
.left-k{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.left-k .cur{font-family:var(--display);font-size:26px;font-weight:800;font-stretch:80%;color:var(--muted)}
.left-k b{font-family:var(--display);font-size:68px;font-weight:900;font-stretch:72%;line-height:.9;font-variant-numeric:tabular-nums}
.hero.neg .left-k b{color:var(--bad)}
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--good-soft);gap:2px}
.stack i{display:block;height:100%;transition:width .45s ease}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.legend div{min-width:0}
.legend .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend .k i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .v{font-family:var(--display);font-size:22px;font-weight:800;font-stretch:82%;font-variant-numeric:tabular-nums;white-space:nowrap}
.alert{font-size:15px;font-weight:600;padding:10px 12px;border-radius:14px;background:var(--accent-soft);display:flex;gap:8px;align-items:center}
.alert.ok{background:var(--good-soft)}
.alert.bad{background:var(--bad-soft)}

/* secciones */
.sec-h{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:26px 2px 6px}
.sec-h h2{font-size:34px;font-stretch:78%;font-weight:900;text-transform:uppercase;line-height:1}
.ring{width:62px;height:62px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--display);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:15px;color:var(--muted);margin:2px 2px 14px;display:flex;gap:8px;align-items:center}
.hint svg{flex:none;width:18px;height:18px}

/* gastos fijos */
.list{display:grid;gap:10px}
.fx{--c:var(--p-blue);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 12px 14px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:background .2s ease,border-color .2s ease}
.fx .body{min-width:0;text-align:left;display:block;width:100%}
.fx .nm{font-weight:700;font-size:18px;line-height:1.2;display:block}
.fx .amt{display:flex;align-items:baseline;gap:5px;margin-top:4px}
.fx .amt small{font-size:14px;font-weight:700;color:var(--muted)}
.fx .amt b{font-family:var(--display);font-size:32px;font-weight:900;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums}
.fx .st{font-size:14px;color:var(--muted);margin-top:4px;display:block}
.fx.paid{background:var(--surface-2)}
.fx.paid .nm{color:var(--muted)}
.fx.paid .st{color:var(--good);font-weight:700}
.check{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent;transition:all .2s ease;flex:none;background:var(--surface)}
.check svg{width:28px;height:28px}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on-good)}
.fx.bumped{animation:bump .9s ease}
@keyframes bump{0%{box-shadow:0 0 0 0 var(--good)}30%{transform:scale(1.02)}100%{box-shadow:0 0 0 14px transparent;transform:none}}
.totals{margin-top:12px;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px}
.totals .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px}
.totals .row b{font-family:var(--display);font-size:22px;font-weight:800;font-stretch:82%;font-variant-numeric:tabular-nums}
.totals .row.good b{color:var(--good)}
.totals .row.due b{color:var(--accent)}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:20px;border:1.5px dashed var(--line);color:var(--muted);font-weight:700;width:100%;margin-top:10px;font-size:16px}
.add-row svg{width:20px;height:20px}

/* gastos variables */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:60px;padding:0 20px;border-radius:18px;font-weight:700;font-size:18px;width:100%}
.btn svg{width:24px;height:24px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.sm{height:44px;font-size:15px;border-radius:14px;width:auto;padding:0 16px}
.budget{margin-top:12px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.budget .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.budget .top b{font-family:var(--display);font-size:40px;font-weight:900;font-stretch:75%;line-height:1;font-variant-numeric:tabular-nums}
.budget .top b small{font-size:18px;color:var(--muted);font-weight:700}
.budget .sub{font-size:15px;color:var(--muted)}
.stack.spent{background:var(--surface-2);height:16px}
.stack.spent.over{box-shadow:0 0 0 2px var(--bad)}
.spent-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.spent-leg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.spent-leg i{width:10px;height:10px;border-radius:3px;flex:none}
.spent-leg b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent));transition:width .4s ease}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.cat{--c:var(--p-blue);position:relative;text-align:left;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px;min-width:0;transition:transform .15s ease}
.cat:active{transform:scale(.97)}
.cat .nm{font-weight:700;font-size:17px;line-height:1.15}
.cat .v{font-family:var(--display);font-size:28px;font-weight:900;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums}
.cat .v small{font-size:14px;color:var(--muted);font-weight:700;margin-right:3px}
.cat .n{font-size:13.5px;color:var(--muted)}
.cat .of{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);margin-left:5px;font-stretch:100%}
.bar.sm{height:8px;margin-top:-2px}
.cat .plus{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cat.editing{border-style:dashed;border-width:1.5px}
.cat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 0}
.link-btn{height:40px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.link-btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid var(--sheet);box-shadow:0 0 0 2px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.cat .plus svg{width:18px;height:18px}
.moves{list-style:none;margin:0;padding:0 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.moves li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.moves li:last-child{border-bottom:0}
.moves .nm{font-weight:700;font-size:16px;line-height:1.2}
.moves .d{font-size:13.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.moves .r{display:flex;align-items:center;gap:6px}
.moves .r b{font-family:var(--display);font-size:22px;font-weight:800;font-stretch:82%;font-variant-numeric:tabular-nums;white-space:nowrap}
.trash{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.trash.ed{color:var(--accent)}
.moves .r{gap:2px}
.mv-b{display:block;min-width:0;text-align:left;width:100%}
.trash svg{width:19px;height:19px}
.confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--bad-soft);font-size:15px;font-weight:600}
.confirm span{flex:1;min-width:140px}
.empty{padding:26px 20px;border-radius:20px;background:var(--surface);border:1px dashed var(--line);text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted);font-size:16px}
.empty .big{font-size:36px}

/* resumen */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:34px;font-weight:900;font-stretch:76%;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b small{font-size:15px;color:var(--muted);font-weight:700;margin-right:3px}
.kpi .s{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}
.kpi.edit{text-align:left;width:100%;position:relative}
.kpi.edit .pen{position:absolute;top:12px;right:12px;color:var(--accent)}
.kpi.edit .pen svg{width:18px;height:18px}
.card{padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0;margin-top:12px}
.brk{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.brk li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.brk .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:700;font-size:16px}
.brk .t b{font-family:var(--display);font-stretch:82%;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.brk .bar{height:10px;margin-top:6px}
.brk .p{font-size:12.5px;color:var(--muted);font-weight:700}
.hist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:190px;margin-top:14px}
.hist .col{display:grid;grid-template-rows:auto 1fr auto;gap:6px;height:100%;min-width:0;text-align:center}
.hist .val{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .track{display:flex;align-items:flex-end;justify-content:center}
.hist .track i{display:block;width:100%;max-width:44px;border-radius:9px 9px 4px 4px;background:var(--line);min-height:4px}
.hist .col.cur .track i{background:var(--accent)}
.hist .col.cur .val{color:var(--ink)}
.hist .m{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.foot-note{font-size:13.5px;color:var(--muted);margin:16px 4px 0;text-align:center}
/* ahorro de cada mes */

<script>
(function(){
const KEY='supergastos-mario-v1';
let cloudRef=null,pendingRemote=null,lastJs='';
const offTxt=()=>navigator.onLine?'Conectando…':'Sin conexión';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const COLORS=['blue','red','teal','yellow','green','purple','orange','pink'];
/* métodos de pago */
const PAYS=[
  {id:'bcp',name:'BCP',sub:'Tarjeta',e:'💳',color:'blue'},
  {id:'yape',name:'Yape',e:'📱',color:'purple'},
  {id:'plin',name:'Plin',e:'📲',color:'teal'},
  {id:'cash',name:'Cash',e:'💵',color:'green'},
  {id:'ibk',name:'IBK',sub:'Tarjeta',e:'💳',color:'orange'},
  {id:'transf',name:'Transf',long:'Transferencia',e:'🏦',color:'yellow'}
];
/* todo lo pagado en un mes con su método: gastos del día a día + fijos ya pagados */
function payItems(kk){const p=S.paid[kk]||{};return [...entriesOf(kk),...S.fixed.filter(f=>p[f.id]).map(f=>({amount:Number(p[f.id].amount),pay:p[f.id].pay||f.pay}))]}
function payOfEntry(e,long){const m=PAYS.find(x=>x.id===e.pay);if(!m)return '';if(long&&m.long)return m.long;return long&&m.sub?m.name+' ('+m.sub+')':m.name}

const DEFAULT={
  v:4,
  income:6222,
  fixed:[
    {id:'alquiler',name:'Alquiler',emoji:'🏠',amount:2275,color:'blue'},
    {id:'seguro',name:'Seguro Médico',emoji:'🩺',amount:1560,color:'red'},
    {id:'agua',name:'Agua + Mantenimiento',emoji:'💧',amount:230,color:'teal'},
    {id:'seguroauto',name:'Seguro Auto',emoji:'🚗',amount:110,color:'purple'},
    {id:'luz',name:'Luz',emoji:'💡',amount:100,color:'yellow'},
    {id:'regatas',name:'Regatas',emoji:'🚣',amount:287,color:'blue'},
    {id:'celular',name:'Celular',emoji:'📱',amount:31,color:'purple'},
    {id:'internet',name:'Internet + TV',emoji:'📺',amount:61,color:'orange'},
    {id:'seguromama',name:'Seguro Mamá',emoji:'👵',amount:100,color:'pink'},
    {id:'gastosmama',name:'Gastos Mamá',emoji:'💐',amount:400,color:'pink'},
    {id:'apple',name:'Apple',emoji:'🍎',amount:48,color:'red'},
    {id:'chatgpt',name:'ChatGPT',emoji:'🤖',amount:20,color:'green'}
  ],
  cats:[
    {id:'transporte',name:'Transporte',emoji:'🚕',color:'yellow',budget:250},
    {id:'mercado',name:'Mercado',emoji:'🛒',color:'green',budget:500},
    {id:'sofi',name:'Sofi',emoji:'💛',color:'pink',budget:200},
    {id:'salud',name:'Salud',emoji:'💊',color:'red'},
    {id:'hogar',name:'Hogar',emoji:'🛋️',color:'purple'},
    {id:'salidas',name:'Salidas',emoji:'🍽️',color:'orange'},
    {id:'trabajo',name:'Trabajo',emoji:'💼',color:'blue'},
    {id:'otros',name:'Otros',emoji:'📦',color:'teal'}
  ],
  paid:{},
  entries:[]
};

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
/* _fresh: equipo nuevo sin datos propios; al conectarse toma lo de la nube en vez de mezclar los gastos de ejemplo */
if(!S||!S.fixed){S=JSON.parse(JSON.stringify(DEFAULT));S._fresh=true}
function migrate(){
  S.v=S.v||1;S.tomb=S.tomb||{};S.bill=S.bill||{};S.paid=S.paid||{};S.entries=S.entries||[];S.cats=S.cats||JSON.parse(JSON.stringify(DEFAULT.cats));
/* actualización v2: Seguro Auto, Gastos Mamá, Seguro Mamá S/100, ingreso S/6,222 (conserva lo ya marcado) */
if(!S.v||S.v<2){
  const has=id=>S.fixed.some(f=>f.id===id);
  const after=(id,item)=>{if(has(item.id))return;const i=S.fixed.findIndex(f=>f.id===id);S.fixed.splice(i<0?S.fixed.length:i+1,0,item)};
  after('agua',DEFAULT.fixed.find(f=>f.id==='seguroauto'));
  after('seguromama',DEFAULT.fixed.find(f=>f.id==='gastosmama'));
  const sm=S.fixed.find(f=>f.id==='seguromama');if(sm&&Number(sm.amount)===90){sm.amount=100;sm.u=Date.now()}
  if(Number(S.income)===6000)S.income=6222;
  S.v=2;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
/* actualización v3: estimados de Mercado S/500, Sofi S/200, Transporte S/250 */
if(S.v<3){
  DEFAULT.cats.forEach(d=>{if(!d.budget)return;const c=S.cats.find(x=>x.id===d.id);if(c&&c.budget==null){c.budget=d.budget;c.u=Date.now()}});
  S.v=3;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
/* actualización v4: categorías Trabajo y Otros */
if(S.v<4){
  ['trabajo','otros'].forEach(id=>{if(!S.cats.some(c=>c.id===id))S.cats.push(DEFAULT.cats.find(c=>c.id===id))});
  S.v=4;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
/* actualización v5: todos los gastos fijos se pagan con tarjeta BCP (se puede cambiar en cada uno) */
if(S.v<5){
  S.fixed.forEach(f=>{if(!f.pay){f.pay='bcp';f.u=Date.now()}});
  S.v=5;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
/* actualización v6: recupera lo que se perdió el 28 oct (4 gastos del 26 oct y dos métodos de pago), sacado del respaldo del 27 oct */
if(S.v<6){
  if(window.FIREBASE_CONFIG&&(window.FIREBASE_DOC||'mario')==='mario'&&!S._fresh){
    const now=Date.now();
    [{id:'mvppeljc',cat:'sofi',amount:56.5,pay:'bcp',note:'Baño',date:'2026-10-26'},
     {id:'mvppfpuk',cat:'otros',amount:22,pay:'bcp',note:'Peluquería',date:'2026-10-26'},
     {id:'mvppgygn',cat:'transporte',amount:10,pay:'yape',note:'Lavado de auto',date:'2026-10-26'},
     {id:'mvpphn4h',cat:'hogar',amount:10,pay:'yape',note:'Lustrada de zapatos',date:'2026-10-26'}
    ].forEach(r=>{if(!S.entries.some(e=>e.id===r.id)&&!(S.tomb||{})['e:'+r.id])S.entries.push({...r,u:1})});
    const fr=S.entries.find(e=>e.id==='mvmu85uu');if(fr&&!fr.pay){fr.pay='bcp';fr.u=now}
    const gm=S.fixed.find(f=>f.id==='gastosmama');if(gm&&gm.pay==='bcp'&&!gm.u){gm.pay='yape';gm.u=now}
  }
  S.v=6;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
}
migrate();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushCloud()}
/* marca algo como borrado para que, al juntar con la nube, no vuelva a aparecer */
function tombAdd(k){S.tomb=S.tomb||{};S.tomb[k]=Date.now()}

const now=new Date();
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
/* la app empieza en noviembre 2026 */
const START_Y=2026,START_M=10,START_KEY='2026-11';
/* fechas de facturación del banco: [consumos desde, consumos hasta, fecha de pago] */
const BILL={
  '2026-01':['25 dic','23 ene','lunes 23 de febrero'],
  '2026-02':['24 ene','25 feb','lunes 23 de marzo'],
  '2026-03':['26 feb','25 mar','martes 21 de abril'],
  '2026-04':['26 mar','24 abr','miércoles 20 de mayo'],
  '2026-05':['25 abr','25 may','lunes 22 de junio'],
  '2026-06':['26 may','25 jun','martes 21 de julio'],
  '2026-07':['26 jun','24 jul','jueves 20 de agosto'],
  '2026-08':['25 jul','25 ago','martes 22 de setiembre'],
  '2026-09':['26 ago','25 set','martes 20 de octubre'],
  '2026-10':['26 set','23 oct','lunes 23 de noviembre'],
  '2026-11':['24 oct','25 nov','martes 22 de diciembre'],
  '2026-12':['26 nov','24 dic','miércoles 20 de enero']
};
const realKey=now.getFullYear()+'-'+pad(now.getMonth()+1);
const curKey=realKey<START_KEY?START_KEY:realKey;
let viewY=+curKey.slice(0,4),viewM=+curKey.slice(5)-1;
let tab='variables',catEdit=false;
const mKey=()=>viewY+'-'+pad(viewM+1);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.round(n*100)/100;return n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const money=n=>'S/ '+fmt(n);
const col=c=>'var(--p-'+(c||'blue')+')';
const dayLbl=iso=>{const [y,m,d]=iso.split('-').map(Number);return d+' '+MES3[m-1].toLowerCase()};

/* cálculos */
function paidMap(k){return S.paid[k]||(S.paid[k]={})}
function fixedTotal(){return S.fixed.reduce((a,f)=>a+Number(f.amount||0),0)}
function fixedPaid(k){const p=S.paid[k]||{};return S.fixed.reduce((a,f)=>a+(p[f.id]?Number(p[f.id].amount):0),0)}
/* ciclos de facturación: cada mes suma los gastos del día a día de su ciclo del banco (ej. Noviembre = 24 oct al 25 nov) */
const MES_N={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,set:9,sep:9,oct:10,nov:11,dic:12};
const isoD=(y,m,d)=>{const t=new Date(y,m-1,d);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const keyShift=(k,n)=>{const d=new Date(+k.slice(0,4),+k.slice(5)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const cycleCache={};
function cycleOf(k){
  if(cycleCache[k])return cycleCache[k];
  const y=+k.slice(0,4),m=+k.slice(5);let c;
  const o=(S.bill||{})[k],b=BILL[k];
  if(o&&o.from&&o.to){
    c={from:o.from,to:o.to};
  }else if(b){
    const p=t=>{const [d,mm]=t.split(' ');return [+d,MES_N[mm]]};
    const [d1,m1]=p(b[0]),[d2]=p(b[1]);
    c={from:isoD(m1>m?y-1:y,m1,d1),to:isoD(y,m,d2)};
  }else if(k>'2026-01'){
    /* mes sin fechas del banco todavía: empieza al día siguiente del ciclo anterior y termina el 25 */
    const pv=cycleOf(keyShift(k,-1));const t=new Date(pv.to+'T12:00');
    c={from:isoD(t.getFullYear(),t.getMonth()+1,t.getDate()+1),to:isoD(y,m,25)};
  }else c={from:isoD(y,m,1),to:isoD(y,m+1,0)};
  return cycleCache[k]=c;
}
function keyOfDate(iso){
  let k=iso.slice(0,7);
  for(let i=0;i<3;i++){const c=cycleOf(k);if(iso>c.to)k=keyShift(k,1);else if(iso<c.from)k=keyShift(k,-1);else break}
  return k;
}
const firstDay=()=>cycleOf(START_KEY).from;
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const longDate=iso=>{const t=new Date(iso+'T12:00');return DIAS[t.getDay()]+' '+t.getDate()+' de '+MESES_L[t.getMonth()]};
const nextDay=iso=>{const t=new Date(iso+'T12:00');return isoD(t.getFullYear(),t.getMonth()+1,t.getDate()+1)};
/* fecha de pago como fecha (para las fechas de 2026 que vienen escritas en texto) */
function payOf(k){
  const o=(S.bill||{})[k];if(o&&o.pay)return o.pay;
  const b=BILL[k];if(!b)return '';
  const d=+(b[2].match(/\d+/)||[0])[0],mm=MESES_L.findIndex(m=>b[2].includes(m))+1;if(!d||!mm)return '';
  const y=+k.slice(0,4),m=+k.slice(5);return isoD(mm<m?y+1:y,mm,d);
}
const hasBill=k=>!!(((S.bill||{})[k]&&S.bill[k].to)||BILL[k]);
function entriesOf(k){const c=cycleOf(k);return S.entries.filter(e=>e.date>=c.from&&e.date<=c.to)}
function varSpent(k){return entriesOf(k).reduce((a,e)=>a+Number(e.amount),0)}
function catSpent(k,id){return entriesOf(k).filter(e=>e.cat===id).reduce((a,e)=>a+Number(e.amount),0)}

/* tema */
const themeBtn=document.getElementById('themeBtn');
const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>';
const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>';
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function paintTheme(){themeBtn.innerHTML=isDark()?sun:moon}
try{const t=localStorage.getItem(KEY+'-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
themeBtn.onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(KEY+'-theme',t)}catch(e){}paintTheme()};
paintTheme();

/* toast */
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}

/* encabezado y tarjeta principal */
function renderTop(){
  const k=mKey();
  document.getElementById('monthLbl').innerHTML=MESES[viewM]+' '+viewY+(k===curKey?'<span class="today-pill">Este mes</span>':'');
  const bl=document.getElementById('billLbl'),cc=cycleOf(k),pay=payOf(k),pen='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
  bl.className='bill'+(hasBill(k)?'':' none');
  bl.innerHTML=hasBill(k)?`💳 Consumos del <b>${dayLbl(cc.from)}</b> al <b>${dayLbl(cc.to)}</b><br>Pago del banco: <b>${pay?longDate(pay):'por confirmar'}</b><span class="ed">${pen}</span>`:`💳 Fechas del banco por cargar<span class="ed">${pen}</span>`;
  document.getElementById('prevM').disabled=k<=START_KEY;
  const inc=Number(S.income)||0,fx=fixedTotal(),vr=varSpent(k),left=inc-fx-vr;
  const base=Math.max(inc,fx+vr,1);
  const due=fx-fixedPaid(k);
  const pend=S.fixed.filter(f=>!(S.paid[k]||{})[f.id]).length;
  const hero=document.getElementById('hero');
  hero.classList.toggle('neg',left<0);
  let alert;
  if(left<0)alert='<div class="alert bad">⚠️ Este mes los gastos pasan tu ingreso por <b>&nbsp;'+money(-left)+'</b></div>';
  else if(pend===0)alert='<div class="alert ok">🎉 ¡Todos los gastos fijos están pagados!</div>';
  else alert='<div class="alert">📌 Te faltan pagar <b>&nbsp;'+pend+(pend===1?' fijo':' fijos')+'&nbsp;</b> por '+money(due)+'</div>';
  hero.innerHTML=`
    <div>
      <p class="eyebrow">${left<0?'Te pasaste por':'Te queda este mes'}</p>
      <div class="left-k"><span class="cur">S/</span><b>${fmt(Math.abs(left))}</b></div>
    </div>
    <div class="stack" role="img" aria-label="Fijos ${money(fx)}, día a día ${money(vr)}, libre ${money(Math.max(left,0))}">
      <i style="width:${fx/base*100}%;background:var(--accent)"></i>
      <i style="width:${vr/base*100}%;background:var(--p-orange)"></i>
    </div>
    <div class="legend">
      <div><span class="k"><i style="background:var(--accent)"></i>Fijos</span><span class="v">${money(fx)}</span></div>
      <div><span class="k"><i style="background:var(--p-orange)"></i>Día a día</span><span class="v">${money(vr)}</span></div>
      <div><span class="k"><i style="background:var(--good)"></i>Libre</span><span class="v">${money(Math.max(left,0))}</span></div>
    </div>
    ${alert}`;
}

/* pestaña: fijos */
const checkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const plusSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
function ringSvg(p,c){const r=26,C=2*Math.PI*r;return `<svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="31" cy="31" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg>`}

function renderFijos(){
  const k=mKey(),p=S.paid[k]||{};
  const n=S.fixed.length,done=S.fixed.filter(f=>p[f.id]).length;
  const sorted=[...S.fixed].sort((a,b)=>(p[a.id]?1:0)-(p[b.id]?1:0));
  return `
  <div class="sec-h"><h2>Gastos fijos</h2><div class="ring">${ringSvg(n?done/n:0,'var(--good)')}<b>${done}/${n}</b></div></div>
  <p class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>Toca el círculo cuando pagues. Toca el nombre para cambiar el monto.</p>
  <div class="list">
    ${sorted.map(f=>{const pd=p[f.id];return `
    <div class="fx${pd?' paid':''}" data-fx="${f.id}" style="--c:${col(f.color)}">
      <span class="coin" style="--c:${col(f.color)}" aria-hidden="true">${esc(f.emoji)}</span>
      <button class="body" data-edit="${f.id}" aria-label="Editar ${esc(f.name)}">
        <span class="nm">${esc(f.name)}</span>
        <span class="amt"><small>S/</small><b>${fmt(f.amount)}</b></span>
        <span class="st">${pd?'✓ Pagado el '+dayLbl(pd.date):'Por pagar'}${payOfEntry({pay:(pd&&pd.pay)||f.pay})?`<span class="pm">${payOfEntry({pay:(pd&&pd.pay)||f.pay})}</span>`:''}</span>
      </button>
      <button class="check" data-pay="${f.id}" aria-pressed="${pd?'true':'false'}" aria-label="${pd?'Desmarcar':'Marcar como pagado'}: ${esc(f.name)}">${checkSvg}</button>
    </div>`}).join('')}
  </div>
  <div class="totals">
    <div class="row"><span>Total fijos</span><b>${money(fixedTotal())}</b></div>
    <div class="row good"><span>Ya pagado</span><b>${money(fixedPaid(k))}</b></div>
    <div class="row due"><span>Falta pagar</span><b>${money(fixedTotal()-fixedPaid(k))}</b></div>
  </div>
  <button class="add-row" id="addFixed">${plusSvg}Agregar gasto fijo</button>`;
}

/* pestaña: día a día */
let confirmDel=null;
function renderVariables(){
  const k=mKey();
  const avail=(Number(S.income)||0)-fixedTotal();
  const spent=varSpent(k),left=avail-spent;
  /* lo gastado por categoría, de mayor a menor, para la barra de colores */
  const byCat=S.cats.map(c=>({name:c.name,emoji:c.emoji,color:c.color,v:catSpent(k,c.id)})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
  const base=Math.max(avail,spent,1);
  const ents=entriesOf(k).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const catOf=id=>S.cats.find(c=>c.id===id)||{name:'Otro',emoji:'•',color:'blue'};
  return `
  <div class="sec-h"><h2>Día a día</h2></div>
  <p class="hint">💳 Aquí cuentan los gastos del ${dayLbl(cycleOf(k).from)} al ${dayLbl(cycleOf(k).to)}. Lo que gastes después pasa al mes siguiente.</p>
  <button class="btn primary" id="addEntry">${plusSvg}Anotar un gasto</button>
  <div class="budget">
    <div class="top"><span class="eyebrow">Llevas gastado</span></div>
    <div class="top"><b style="${left<0?'color:var(--bad)':''}"><small>S/ </small>${fmt(spent)}</b><span class="sub">de ${money(avail)}</span></div>
    <div class="stack spent${left<0?' over':''}" role="img" aria-label="Gastado por categoría">${byCat.map(c=>`<i style="width:${c.v/base*100}%;background:${col(c.color)}" title="${esc(c.name)} ${money(c.v)}"></i>`).join('')}</div>
    ${byCat.length?`<div class="spent-leg">${byCat.map(c=>`<span><i style="background:${col(c.color)}"></i>${esc(c.emoji)} ${esc(c.name)} <b>${money(c.v)}</b></span>`).join('')}</div>`:''}
    <span class="sub">${left<0?`<b style="color:var(--bad)">Te pasaste por ${money(-left)}</b>`:`Te quedan <b style="color:var(--ink)">${money(left)}</b> para el día a día`}</span>
  </div>
  <div class="cat-h"><span class="eyebrow">${catEdit?'Toca una categoría para cambiarla':'Categorías'}</span><button class="link-btn${catEdit?' on':''}" id="editCats">${catEdit?'✓ Listo':'✏️ Editar'}</button></div>
  <div class="cats">
    ${S.cats.map(c=>{const v=catSpent(k,c.id),cnt=entriesOf(k).filter(e=>e.cat===c.id).length;return `
    <button class="cat${catEdit?' editing':''}" ${catEdit?`data-editcat="${c.id}"`:`data-cat="${c.id}"`} style="--c:${col(c.color)}" aria-label="${catEdit?'Editar':'Anotar gasto en'} ${esc(c.name)}">
      <span class="plus" aria-hidden="true">${catEdit?penSvg:plusSvg}</span>
      <span class="coin" style="--c:${col(c.color)}">${esc(c.emoji)}</span>
      <span><span class="nm">${esc(c.name)}</span></span>
      <span class="v"><small>S/</small>${fmt(v)}${c.budget?`<span class="of">de ${fmt(c.budget)}</span>`:''}</span>
      ${c.budget?`<span class="bar sm" style="--c:${v>c.budget?'var(--bad)':v>c.budget*.8?'var(--p-orange)':col(c.color)}"><i style="width:${Math.min(v/c.budget,1)*100}%"></i></span>
      <span class="n" style="${v>c.budget?'color:var(--bad);font-weight:700':''}">${v>c.budget?'Te pasaste '+money(v-c.budget):'Quedan '+money(c.budget-v)}</span>`
      :`<span class="n">${cnt?cnt+(cnt===1?' gasto':' gastos'):'Sin gastos aún'}</span>`}
    </button>`}).join('')}
  </div>
  <button class="add-row" id="addCat">${plusSvg}Nueva categoría</button>
  <div class="sec-h" style="margin-top:28px"><h2 style="font-size:26px">Últimos gastos</h2></div>
  ${ents.length?`<ul class="moves">${ents.map(e=>{const c=catOf(e.cat);return `
    <li>
      <span class="coin sm" style="--c:${col(c.color)}" aria-hidden="true">${esc(c.emoji)}</span>
      <button class="mv-b" data-editent="${e.id}" aria-label="Editar gasto de ${esc(c.name)}"><div class="nm">${esc(c.name)}</div><div class="d">${payOfEntry(e)?`<span class="pm">${payOfEntry(e)}</span> `:''}${dayLbl(e.date)}${e.note?' · '+esc(e.note):''}</div></button>
      <div class="r"><b>${money(e.amount)}</b><button class="trash ed" data-editent="${e.id}" aria-label="Editar gasto">${penSvg}</button><button class="trash" data-del="${e.id}" aria-label="Borrar gasto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg></button></div>
      ${confirmDel===e.id?`<div class="confirm"><span>¿Borrar este gasto de ${money(e.amount)}?</span><button class="btn sm danger" data-delyes="${e.id}">Sí, borrar</button><button class="btn sm ghost" data-delno>No</button></div>`:''}
    </li>`}).join('')}</ul>`
  :`<div class="empty"><span class="big">🧾</span><b style="color:var(--ink)">Todavía no hay gastos este mes</b><span>Toca una categoría o “Anotar un gasto” para empezar.</span></div>`}`;
}

/* pestaña: resumen */
function renderResumen(){
  const k=mKey();
  const inc=Number(S.income)||0,fx=fixedTotal(),vr=varSpent(k),left=inc-fx-vr;
  const rows=[
    ...S.fixed.map(f=>({name:f.name,emoji:f.emoji,color:f.color,v:Number(f.amount),tag:'Fijo'})),
    ...S.cats.map(c=>({name:c.name,emoji:c.emoji,color:c.color,v:catSpent(k,c.id),tag:'Día a día'}))
  ].filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const max=Math.max(...rows.map(r=>r.v),1);
  const tot=fx+vr||1;
  // últimos 6 meses
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(viewY,viewM-i,1);const kk=d.getFullYear()+'-'+pad(d.getMonth()+1);if(kk<START_KEY)continue;months.push({k:kk,m:MES3[d.getMonth()],v:fixedPaid(kk)+varSpent(kk)})}
  const hmax=Math.max(...months.map(m=>m.v),1);
  // ahorro: ingreso − fijos (lo pagado, o el monto actual si falta pagar) − día a día del ciclo
  const fixedFor=kk=>{const p=S.paid[kk]||{};return S.fixed.reduce((a,f)=>a+(p[f.id]?Number(p[f.id].amount):Number(f.amount||0)),0)};
  const td=todayISO(),nowK=keyOfDate(td)<START_KEY?START_KEY:keyOfDate(td);
  const sav=[];for(let kk=START_KEY;kk<=nowK;kk=keyShift(kk,1)){const c=cycleOf(kk);sav.push({k:kk,left:inc-fixedFor(kk)-varSpent(kk),closed:td>c.to,to:c.to})}
  const closed=sav.filter(x=>x.closed),saved=closed.reduce((a,x)=>a+x.left,0);
  const mName=kk=>MESES[+kk.slice(5)-1]+(kk.slice(0,4)!==String(viewY)?' '+kk.slice(0,4):'');
  const savCard=`
  <div class="card">
    <span class="eyebrow">🐷 Ahorro</span>
    ${closed.length?`<div class="sav-top"><span class="coin lg" style="--c:${saved<0?'var(--bad)':'var(--good)'}" aria-hidden="true">${saved<0?'⚠️':'🐷'}</span><div><span class="s">${saved<0?'En total te pasaste':'Llevas ahorrado'}</span><b style="color:${saved<0?'var(--bad)':'var(--good)'}"><small>S/</small>${fmt(Math.abs(saved))}</b><span class="s">${closed.length===1?'en 1 mes':'en '+closed.length+' meses'}</span></div></div>`
    :`<p class="sav-empty">Cuando cierre ${mName(sav[0].k)} (${dayLbl(sav[0].to)}) aquí vas a ver cuánto ahorraste.</p>`}
    <ul class="sav">
      ${sav.slice().reverse().map(x=>`<li><span class="m">${mName(x.k)}<small>${x.closed?'Cerrado el '+dayLbl(x.to):'En curso · cierra el '+dayLbl(x.to)}</small></span>${
        !x.closed?`<span class="pill now">${x.left<0?'Vas pasado ':'Vas ahorrando '}${money(Math.abs(x.left))}</span>`
        :x.left>0?`<span class="pill up">🐷 Ahorraste ${money(x.left)}</span>`
        :x.left<0?`<span class="pill down">Te pasaste ${money(-x.left)}</span>`:`<span class="pill now">Justo</span>`}</li>`).join('')}
    </ul>
  </div>`;
  // por método de pago (solo gastos del día a día del mes)
  const mEnts=payItems(k);
  const pmSum=f=>{const xs=mEnts.filter(f);return {v:xs.reduce((a,e)=>a+Number(e.amount),0),n:xs.length}};
  const pm=[...PAYS.map(m=>({...m,c:col(m.color),...pmSum(e=>e.pay===m.id)})),
    {id:'',name:'Sin método',e:'•',c:'var(--muted)',...pmSum(e=>!PAYS.some(m=>m.id===e.pay))}].filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const pmTot=pm.reduce((a,x)=>a+x.v,0)||1,pmMax=Math.max(...pm.map(x=>x.v),1);
  const payCard=`
  <div class="card">
    <span class="eyebrow">💳 Por método de pago</span>
    <p class="hint" style="margin:6px 0 0">Gastos del día a día y fijos pagados de ${MESES[viewM]}</p>
    ${pm.length?`
    <div class="stack spent" style="margin-top:12px" role="img" aria-label="Gastado por método de pago">${pm.map(x=>`<i style="width:${x.v/pmTot*100}%;background:${x.c}"></i>`).join('')}</div>
    <ul class="brk" style="margin-top:14px">
      ${pm.map(x=>`<li><span class="coin sm" style="--c:${x.c}" aria-hidden="true">${x.e}</span><div style="min-width:0"><div class="t"><span>${x.name}${x.sub?` <small style="color:var(--muted);font-weight:600">${x.sub}</small>`:''}</span><b>${money(x.v)}</b></div><div class="bar" style="--c:${x.c}"><i style="width:${x.v/pmMax*100}%"></i></div><span class="p">${Math.round(x.v/pmTot*100)}% · ${x.n} ${x.n===1?'gasto':'gastos'}</span></div></li>`).join('')}
    </ul>`:`<p class="sav-empty">Cuando anotes gastos este mes, aquí vas a ver con qué pagaste.</p>`}
  </div>`;
  return `
  <div class="sec-h"><h2>Resumen</h2></div>

      qs.docs.map(d=>({day:d.id,data:d.data()})).sort((a,b)=>b.day.localeCompare(a.day)).forEach(({day,data})=>{(data.entries||[]).forEach(x=>{if(!have.has(x.id)&&!found.has(x.id))found.set(x.id,{...x,from:day})})});

          :'<p class="hint" style="margin-top:10px">✓ No falta ningún gasto: todo lo de los respaldos ya está en la app.</p>';
      };
      const restore=ids=>{ids.forEach(id=>{const i=list.findIndex(x=>x.id===id);if(i<0)return;const x={...list[i]};delete x.from;x.u=Date.now();S.entries.push(x);list.splice(i,1)});save();render();draw();toast(ids.length===1?'✓ Gasto recuperado':'✓ '+ids.length+' gastos recuperados')};

    b.disabled=false;b.innerHTML=old;
  };

function exportExcel(){
  const X=window.XLSX,inc=Number(S.income)||0;
  const mLbl=kk=>MESES[+kk.slice(5)-1]+' '+kk.slice(0,4);
  const catOf=id=>S.cats.find(c=>c.id===id)||{name:'Otros'};
  const isoTxt=iso=>{const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
  // meses: desde noviembre 2026 hasta el mes actual o el último gasto anotado
  const td=todayISO();let last=keyOfDate(td);
  S.entries.forEach(e=>{const kk=keyOfDate(e.date);if(kk>last)last=kk});
  if(last<START_KEY)last=START_KEY;
  const months=[];for(let kk=START_KEY;kk<=last;kk=keyShift(kk,1))months.push(kk);
  // hoja 1: día a día
  const dia=S.entries.filter(e=>e.date>=firstDay()).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({'Fecha':isoTxt(e.date),'Mes':mLbl(keyOfDate(e.date)),'Categoría':catOf(e.cat).name,'Monto (S/)':Number(e.amount),'Método de pago':payOfEntry(e,true),'Nota':e.note||''}));
  // hoja 2: gastos fijos por mes
  const fijos=[];months.forEach(kk=>{const p=S.paid[kk]||{};S.fixed.forEach(f=>{const pd=p[f.id];fijos.push({'Mes':mLbl(kk),'Gasto':f.name,'Monto (S/)':pd?Number(pd.amount):Number(f.amount||0),'Estado':pd?'Pagado':'Pendiente','Fecha de pago':pd?isoTxt(pd.date):'','Método de pago':payOfEntry({pay:(pd&&pd.pay)||f.pay},true)})})});
  // hoja 3: resumen por mes
  const res=months.map(kk=>{const p=S.paid[kk]||{};const fx=S.fixed.reduce((a,f)=>a+(p[f.id]?Number(p[f.id].amount):Number(f.amount||0)),0),vr=varSpent(kk),c=cycleOf(kk);
    return {'Mes':mLbl(kk),'Ingreso (S/)':inc,'Gastos fijos (S/)':fx,'Día a día (S/)':vr,'Ahorro (S/)':inc-fx-vr,'Estado':td>c.to?'Cerrado':'En curso'}});
  // hoja 4: día a día por categoría y mes
  const porPago=[];months.forEach(kk=>{const es=payItems(kk);[...PAYS.map(m=>({n:payOfEntry({pay:m.id},true),f:e=>e.pay===m.id})),{n:'Sin método',f:e=>!PAYS.some(m=>m.id===e.pay)}].forEach(m=>{const xs=es.filter(m.f);if(xs.length)porPago.push({'Mes':mLbl(kk),'Método de pago':m.n,'Gastado (S/)':xs.reduce((a,e)=>a+Number(e.amount),0),'Gastos':xs.length})})});
  const porCat=[];months.forEach(kk=>S.cats.forEach(c=>{const v=catSpent(kk,c.id);if(v>0)porCat.push({'Mes':mLbl(kk),'Categoría':c.name,'Gastado (S/)':v,'Estimado (S/)':c.budget||''})}));
  const wb=X.utils.book_new();
  const add=(rows,name,cols,head)=>{
    const ws=rows.length?X.utils.json_to_sheet(rows):X.utils.aoa_to_sheet([head]);
    ws['!cols']=cols.map(w=>({wch:w}));
    const r=X.utils.decode_range(ws['!ref']);
    for(let R=1;R<=r.e.r;R++)for(let C=0;C<=r.e.c;C++){const cell=ws[X.utils.encode_cell({r:R,c:C})];const hd=ws[X.utils.encode_cell({r:0,c:C})];if(cell&&cell.t==='n'&&hd&&String(hd.v).includes('S/'))cell.z='#,##0.00'}
    X.utils.book_append_sheet(wb,ws,name);
  };
  add(dia,'Día a día',[12,16,16,12,16,34],['Fecha','Mes','Categoría','Monto (S/)','Método de pago','Nota']);
  add(fijos,'Gastos fijos',[16,24,12,11,14,16],['Mes','Gasto','Monto (S/)','Estado','Fecha de pago','Método de pago']);
  add(res,'Resumen por mes',[16,13,17,15,13,10],['Mes','Ingreso (S/)','Gastos fijos (S/)','Día a día (S/)','Ahorro (S/)','Estado']);
  add(porCat,'Por categoría',[16,18,14,14],['Mes','Categoría','Gastado (S/)','Estimado (S/)']);
  add(porPago,'Por método de pago',[16,18,14,10],['Mes','Método de pago','Gastado (S/)','Gastos']);
  X.writeFile(wb,'SuperFinance-Mario-'+td+'.xlsx');
}

    const d=sheet.querySelector('#dateIn').value||defDate;
    if(d<firstDay()){toast('La app empieza con los consumos del '+dayLbl(firstDay()));return}
    const data={cat:sel,amount:Math.round(v*100)/100,note:sheet.querySelector('#noteIn').value.trim(),date:d};
    if(payId)data.pay=payId;
    data.u=Date.now();
    if(ed){Object.assign(ed,data)}
    else{S.entries.push({id:Date.now().toString(36),...data});S.lastPay=payId}
    save();
    const dk=keyOfDate(d);const moved=dk!==mKey();if(moved){const [y,m]=dk.split('-').map(Number);viewY=y;viewM=m-1}
    closeSheet();render();
    const c=S.cats.find(x=>x.id===sel)||{name:'Otros'};toast((ed?'✓ Gasto actualizado':'✓ '+money(v)+' en '+c.name)+(moved?' · cuenta para '+MESES[viewM]:''));
  };
  sheet.querySelector('[data-close]').onclick=closeSheet;
}

  const draw=()=>{
    openSheetInner(`

    <div class="sh-actions">

    sheet.querySelector('#fxSave').onclick=()=>{
      const name=sheet.querySelector('#fxName').value.trim(),amount=parseAmt(sheet.querySelector('#fxAmt').value),emoji=sheet.querySelector('#fxEmo').dataset.v||'📌';
      if(!name){sheet.querySelector('#fxName').focus();toast('Escribe un nombre');return}
      if(id){Object.assign(f,{name,amount,emoji,pay:fxPay,u:Date.now()});const pd=(S.paid[mKey()]||{})[id];if(pd){pd.pay=fxPay;pd.u=Date.now()}}
      else S.fixed.push({id:'f'+Date.now().toString(36),name,emoji,amount,color:f.color,pay:fxPay,u:Date.now()});
      save();closeSheet();render();toast('✓ Guardado');
    };
    const d=sheet.querySelector('#fxDel');if(d)d.onclick=()=>{askDel=true;draw()};
    const y=sheet.querySelector('#fxDelYes');if(y)y.onclick=()=>{tombAdd('f:'+id);S.fixed=S.fixed.filter(x=>x.id!==id);save();closeSheet();render();toast('Gasto fijo quitado')};

const penSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
function openCat(id){
  const c=id?S.cats.find(x=>x.id===id):null;
  const d={name:c?c.name:'',emoji:c?c.emoji:'🏷️',budget:c&&c.budget?c.budget:'',color:c?c.color:COLORS[S.cats.length%COLORS.length]};

  const keep=()=>{const q=x=>sheet.querySelector(x);if(!q('#catName'))return;d.name=q('#catName').value;d.emoji=q('#catEmo').dataset.v;d.budget=q('#catBud').value};
  const draw=()=>{
    openSheetInner(`
    <div class="sh-head"><div><p class="eyebrow">Día a día</p><h2 id="shTitle">${id?'Editar categoría':'Nueva categoría'}</h2></div>${closeBtn}</div>
    <label class="lbl" for="catName">Nombre e ícono</label>

    <p class="emo-hint">Toca el ícono para elegir otro.</p>
    <span class="lbl">Color</span>
    <div class="colors" id="catColors">${COLORS.map(k=>`<button data-col="${k}" style="--c:${col(k)}" aria-pressed="${k===d.color}" aria-label="Color ${k}"></button>`).join('')}</div>
    <label class="lbl" for="catBud">Estimado al mes (opcional)</label>
    <div class="money"><span>S/</span><input id="catBud" inputmode="decimal" value="${d.budget}" placeholder="0" autocomplete="off"></div>
    <p class="emo-hint">Déjalo vacío si no quieres ponerle estimado.</p>
    <div class="sh-actions">
      <button class="btn primary" id="catSave">${checkSvg}${id?'Guardar':'Crear categoría'}</button>
      ${id&&S.cats.length>1?(askDel?`<div class="inline-confirm"><span>¿Borrar “${esc(d.name)}”?${nUsed&&id!=='otros'&&S.cats.some(x=>x.id==='otros')?' Sus '+nUsed+(nUsed===1?' gasto pasa':' gastos pasan')+' a “Otros”.':''}</span><button class="btn sm danger" id="catDelYes">Sí, borrar</button><button class="btn sm ghost" id="catDelNo">No</button></div>`:'<button class="btn danger" id="catDel">Borrar esta categoría</button>'):''}
    </div>`);
    const q=x=>sheet.querySelector(x);
    q('[data-close]').onclick=closeSheet;
    q('#catColors').onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;d.color=b.dataset.col;sheet.querySelectorAll('#catColors button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.col===d.color))};
    q('#catSave').onclick=()=>{
      keep();const name=d.name.trim(),emoji=d.emoji.trim()||'🏷️',bud=parseAmt(d.budget);
      if(!name){q('#catName').focus();toast('Escribe un nombre');return}
      if(S.cats.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){toast('Ya hay una categoría con ese nombre');return}
      let t=c;
      if(!t){t={id:'c'+Date.now().toString(36)};S.cats.push(t)}
      Object.assign(t,{name,emoji,color:d.color,u:Date.now()});
      if(bud>0)t.budget=Math.round(bud*100)/100;else delete t.budget;
      save();closeSheet();render();toast(id?'✓ Categoría guardada':'✓ Categoría '+name+' creada');
    };
    const del=q('#catDel');if(del)del.onclick=()=>{keep();askDel=true;draw()};
    const no=q('#catDelNo');if(no)no.onclick=()=>{keep();askDel=false;draw()};
    const yes=q('#catDelYes');if(yes)yes.onclick=()=>{
      if(id!=='otros'&&S.cats.some(x=>x.id==='otros'))S.entries.forEach(e=>{if(e.cat===id){e.cat='otros';e.u=Date.now()}});
      tombAdd('c:'+id);S.cats=S.cats.filter(x=>x.id!==id);save();closeSheet();render();toast('Categoría borrada');
    };
  };
  draw();
}
/* cargar o cambiar a mano las fechas del banco de un mes */
function openBill(k){
  const c=cycleOf(k),o=(S.bill||{})[k],known=hasBill(k);
  const prevTo=k>START_KEY||BILL[keyShift(k,-1)]||(S.bill||{})[keyShift(k,-1)]?cycleOf(keyShift(k,-1)).to:'';
  const sug=prevTo?nextDay(prevTo):c.from;
  const f0=known?c.from:sug,t0=known?c.to:'',p0=payOf(k);
  const mName=MESES[+k.slice(5)-1]+' '+k.slice(0,4);
  openSheet(`
    <div class="sh-head"><div><p class="eyebrow">${mName}</p><h2 id="shTitle">Fechas del banco</h2></div>${closeBtn}</div>
    <p class="hint" style="margin-top:8px">Cópialas de la tabla de facturación de tu tarjeta.</p>
    <label class="lbl" for="bFrom">Consumos desde</label>
    <input class="field" id="bFrom" type="date" value="${f0}">
    <label class="lbl" for="bTo">Consumos hasta</label>
    <input class="field" id="bTo" type="date" value="${t0}">
    <label class="lbl" for="bPay">Fecha de pago</label>
    <input class="field" id="bPay" type="date" value="${p0}">
    <div id="bWarn"></div>
    <div class="sh-actions">
      <button class="btn primary" id="bSave">${checkSvg}Guardar fechas</button>
      ${o?`<button class="btn ghost" id="bReset">${BILL[k]?'Volver a las fechas que venían cargadas':'Borrar estas fechas'}</button>`:''}
    </div>`);
  const q=x=>sheet.querySelector(x);
  q('[data-close]').onclick=closeSheet;
  const check=()=>{
    const f=q('#bFrom').value,t=q('#bTo').value,msgs=[];
    if(f&&t&&f>t)msgs.push('La fecha “desde” tiene que ser antes que la fecha “hasta”.');
    if(f&&prevTo&&f!==nextDay(prevTo))msgs.push(`El mes anterior termina el ${dayLbl(prevTo)}. Lo normal es que este empiece el ${dayLbl(nextDay(prevTo))}, para que ningún gasto quede fuera.`);
    const nk=keyShift(k,1);if(t&&hasBill(nk)&&cycleOf(nk).from!==nextDay(t))msgs.push(`El mes siguiente empieza el ${dayLbl(cycleOf(nk).from)}. Lo normal es que este termine el día antes.`);
    q('#bWarn').innerHTML=msgs.map(m=>`<p class="warn">⚠️ ${m}</p>`).join('');
    return !(f&&t&&f>t);
  };
  ['#bFrom','#bTo'].forEach(x=>{q(x).addEventListener('change',check);q(x).addEventListener('input',check)});check();
  q('#bSave').onclick=()=>{
    const f=q('#bFrom').value,t=q('#bTo').value,p=q('#bPay').value;
    if(!f||!t){toast('Pon las fechas “desde” y “hasta”');return}
    if(!check())return;
    S.bill=S.bill||{};S.bill[k]={from:f,to:t,pay:p||'',u:Date.now()};
    save();closeSheet();render();toast('✓ Fechas de '+MESES[+k.slice(5)-1]+' guardadas');
  };
  const r=q('#bReset');if(r)r.onclick=()=>{delete S.bill[k];tombAdd('b:'+k);save();closeSheet();render();toast('Listo');};
}
function openIncome(){
  openSheet(`
    <div class="sh-head"><div><p class="eyebrow">Resumen</p><h2 id="shTitle">Ingreso del mes</h2></div>${closeBtn}</div>
    <label class="lbl" for="incIn">¿Cuánto entra al mes?</label>
    <div class="money"><span>S/</span><input id="incIn" inputmode="decimal" value="${S.income}" autocomplete="off"></div>
    <div class="sh-actions"><button class="btn primary" id="incSave">${checkSvg}Guardar</button></div>`);
  sheet.querySelector('[data-close]').onclick=closeSheet;
  sheet.querySelector('#incSave').onclick=()=>{S.income=parseAmt(sheet.querySelector('#incIn').value);S.incomeU=Date.now();save();closeSheet();render();toast('✓ Ingreso actualizado')};

/* ===== Nube: Firebase (solo funciona en GitHub, cuando FIREBASE_CONFIG está completo) =====
   Guardado seguro: nunca se sube una copia completa a ciegas. Cada vez que se guarda, se lee lo que hay en
   la nube y se JUNTA con lo de este equipo (gastos por id, lo más nuevo gana, lo borrado queda marcado),
   dentro de una transacción. Si no hay internet, el cambio queda pendiente y se junta al volver la conexión. */
const syncEl=document.getElementById('sync');
/* el indicador solo aparece si algo falla; cuando todo está bien no se muestra nada */
function setSync(cls,txt){if(!syncEl)return;if(cls!=='err'){syncEl.hidden=true;return}syncEl.hidden=false;syncEl.className='sync'+(cls?' '+cls:'');syncEl.innerHTML='<i></i><span class="t">'+txt+'</span>';syncEl.title=txt}
let pushing=false,pushAgain=false;
const isDirty=()=>{try{return localStorage.getItem(KEY+'-dirty')==='1'}catch(e){return false}};
const setDirty=v=>{try{localStorage.setItem(KEY+'-dirty',v?'1':'0')}catch(e){}};
const cleanData=x=>JSON.parse(JSON.stringify(x));
function mergeStates(a,b){
  a=a||{};b=b||{};
  const tomb={...(a.tomb||{})};Object.keys(b.tomb||{}).forEach(k=>{tomb[k]=Math.max(tomb[k]||0,b.tomb[k])});
  const alive=(key,x)=>!(tomb[key]&&tomb[key]>=(x.u||0));
  const pick=(x,y)=>!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);
  const byId=(A,B,pre)=>{const m=new Map();(A||[]).forEach(x=>m.set(x.id,x));(B||[]).forEach(y=>m.set(y.id,pick(m.get(y.id),y)));return [...m.values()].filter(x=>alive(pre+x.id,x))};
  const paid={};new Set([...Object.keys(a.paid||{}),...Object.keys(b.paid||{})]).forEach(k=>{const pa=(a.paid||{})[k]||{},pb=(b.paid||{})[k]||{},o={};new Set([...Object.keys(pa),...Object.keys(pb)]).forEach(id=>{const r=pick(pa[id],pb[id]);if(r&&alive('p:'+k+'|'+id,r))o[id]=r});paid[k]=o});
  const bill={};new Set([...Object.keys(a.bill||{}),...Object.keys(b.bill||{})]).forEach(k=>{const r=pick((a.bill||{})[k],(b.bill||{})[k]);if(r&&alive('b:'+k,r))bill[k]=r});
  const incB=(b.incomeU||0)>(a.incomeU||0);
  const out={...a,entries:byId(a.entries,b.entries,'e:'),fixed:b._fresh?byId(a.fixed,[],'f:'):byId(a.fixed,b.fixed,'f:'),cats:b._fresh?byId(a.cats,[],'c:'):byId(a.cats,b.cats,'c:'),paid,bill,tomb,
    income:incB?b.income:a.income,incomeU:Math.max(a.incomeU||0,b.incomeU||0),lastPay:b.lastPay||a.lastPay||'',v:Math.max(a.v||0,b.v||0)};
  delete out._fresh;return out;
}
function pushCloud(){
  setDirty(true);
  if(!cloudRef)return;
  if(pushing){pushAgain=true;return}
  pushing=true;pushAgain=false;
  cloudRef.firestore.runTransaction(async t=>{
    const snap=await t.get(cloudRef);
    const srv=snap.exists?snap.data():null;
    const out=cleanData(srv?mergeStates(srv,S):S);delete out._fresh;
    out.rev=((srv&&srv.rev)||0)+1;
    t.set(cloudRef,out);
    return out;
  }).then(out=>{
    pushing=false;
    const before=JSON.stringify(S);
    S=mergeStates(out,S);S.rev=out.rev;
    lastJs=JSON.stringify(out);
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(pushAgain){pushCloud();return}
    setDirty(false);
    if(JSON.stringify(S)!==before){if(sheet.hidden)render();else pendingRemote=null}
  }).catch(e=>{
    pushing=false;console.error(e);
    if(e&&e.code==='permission-denied')setSync('err','No se guardó en la nube');
    /* sin internet: queda pendiente y se junta cuando vuelva la conexión */
  });
}
function applyRemote(d){
  if(!d||!d.fixed)return;
  if(isDirty()){pushCloud();return}
  S=d;const before=S.v;migrate();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render();
  if(S.v!==before)pushCloud();
}
function applyPending(){if(pendingRemote){const d=pendingRemote;pendingRemote=null;applyRemote(d)}}
function hasData(x){return x&&((x.entries&&x.entries.length)||Object.keys(x.paid||{}).some(k=>Object.keys(x.paid[k]||{}).length))}
(async function initCloud(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.projectId||/PEGA/.test(cfg.projectId))return;
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
    const db=firebase.firestore(app);
    /* si la red bloquea la conexión continua de Firestore, usa otra forma de conectarse */
    try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    /* borra cualquier copia vieja guardada sin conexión por versiones anteriores, para que no se suba encima */
    try{await db.clearPersistence()}catch(e){}
    const ref=db.collection('finanzas').doc(window.FIREBASE_DOC||'mario');
    let linked=false;try{linked=localStorage.getItem(KEY+'-cloud')==='1'}catch(e){}
    const setLinked=()=>{linked=true;try{localStorage.setItem(KEY+'-cloud','1')}catch(e){}};
    ref.onSnapshot({includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites||snap.metadata.fromCache)return;
      cloudRef=ref;
      if(!snap.exists){setLinked();pushCloud();return}
      const d=snap.data();
      /* respaldo automático: una copia por día en Firebase (finanzas/mario/respaldos/AAAA-MM-DD) */
      if(!window.__bk){window.__bk=1;const day=todayISO();let lb='';try{lb=localStorage.getItem(KEY+'-bk')}catch(e){}
        if(lb!==day&&ref.collection){try{ref.collection('respaldos').doc(day).set(d).then(()=>{try{localStorage.setItem(KEY+'-bk',day)}catch(e){}}).catch(()=>{})}catch(e){}}}
      if(!linked){setLinked();if(hasData(S)&&!S._fresh){pushCloud();return}}
      if(isDirty()){pushCloud();return}
      const js=JSON.stringify(d);
      if(js!==lastJs){lastJs=js;if(!sheet.hidden)pendingRemote=d;else applyRemote(d)}
    },e=>{console.error(e);setSync('err','Sin acceso a la nube')});
    window.addEventListener('online',()=>{if(isDirty())pushCloud()});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isDirty())pushCloud()});
  }catch(e){console.error(e);setSync('err','Error de nube')}
})();

render();
})();
</script>
