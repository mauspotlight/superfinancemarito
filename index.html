function openCats(){
  let editing=null,askDel=null;
  const draw=()=>{
    const c=editing==='new'?{name:'',emoji:'🏷️',color:COLORS[S.cats.length%COLORS.length]}:editing?S.cats.find(x=>x.id===editing):null;
    if(c){
      const used=editing!=='new'&&S.entries.some(e=>e.cat===editing);
      openSheet(`
      <div class="sh-head"><div><p class="eyebrow">Categorías</p><h2 id="shTitle">${editing==='new'?'Nueva categoría':'Editar '+esc(c.name)}</h2></div>${closeBtn}</div>
      <label class="lbl" for="ctName">Nombre e ícono</label>
      <div class="two">${emoBtn('ctEmo',c.emoji)}<input class="field" id="ctName" value="${esc(c.name)}" placeholder="Ej. Mascotas"></div>
      ${emoGrid('ctEmo',c.emoji)}
      <span class="lbl">Color</span>
      <div class="colors" id="ctCol">${COLORS.map(x=>`<button type="button" data-col="${x}" style="--c:${col(x)}" aria-pressed="${x===c.color}" aria-label="Color ${x}"></button>`).join('')}</div>
      <div class="sh-actions">
        <button class="btn primary" type="button" id="ctSave">${checkSvg}Guardar</button>
        <button class="btn ghost" type="button" id="ctBack">Volver a la lista</button>
        ${editing!=='new'?(askDel?`<div class="confirm"><span>${used?'Tiene gastos anotados: pasarán a “Otros”.':'¿Borrar esta categoría?'}</span><button class="btn sm danger" type="button" id="ctDelYes">Sí, borrar</button><button class="btn sm ghost" type="button" id="ctDelNo">No</button></div>`:(S.cats.length>1?'<button class="btn danger" type="button" id="ctDel">Borrar categoría</button>':'')):''}
      </div>`);
      let color=c.color;
      wireEmo('ctEmo');
      wireSeg('ctCol','col',v=>color=v);
      sheet.querySelector('#ctSave').onclick=()=>{
        const name=sheet.querySelector('#ctName').value.trim(),emoji=sheet.querySelector('#ctEmo').dataset.v||'🏷️';
        if(!name){toast('Escribe un nombre');return}
        if(editing==='new')S.cats.push({id:'c'+Date.now().toString(36),name,emoji,color});else Object.assign(c,{name,emoji,color});
        save();render();editing=null;draw();toast('✓ Categoría guardada');
      };
      sheet.querySelector('#ctBack').onclick=()=>{editing=null;askDel=null;draw()};
      const dl=sheet.querySelector('#ctDel');if(dl)dl.onclick=()=>{askDel=true;draw()};
      const dn=sheet.querySelector('#ctDelNo');if(dn)dn.onclick=()=>{askDel=null;draw()};
      const dy=sheet.querySelector('#ctDelYes');if(dy)dy.onclick=()=>{
        S.cats=S.cats.filter(x=>x.id!==editing);
        if(S.entries.some(e=>e.cat===editing)){let o=S.cats.find(x=>x.id==='otros');if(!o){o={id:'otros',name:'Otros',emoji:'📦',color:'blue'};S.cats.push(o)}S.entries.forEach(e=>{if(e.cat===editing)e.cat='otros'})}
        save();render();editing=null;askDel=null;draw();toast('Categoría borrada');
      };
    }else{
      openSheet(`
      <div class="sh-head"><div><p class="eyebrow">Día a día</p><h2 id="shTitle">Categorías</h2></div>${closeBtn}</div>
      <p class="sh-note" style="margin:0 2px 6px">Toca una categoría para cambiar su nombre, emoji o color. Arrastra desde ⠿ para cambiar el orden.</p>
      <ul class="catlist">${S.cats.map(x=>`<li data-id="${x.id}"><button class="drag" type="button" aria-label="Mover ${esc(x.name)} (flechas arriba y abajo)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button><span class="coin sm" style="--c:${col(x.color)}" aria-hidden="true">${esc(x.emoji)}</span><span class="nm">${esc(x.name)}</span><button class="mini-btn" type="button" data-ce="${x.id}" aria-label="Editar ${esc(x.name)}">${penSvg}</button></li>`).join('')}</ul>
      <button class="add-row" type="button" id="ctNew">${plusSvg}Nueva categoría</button>`);
      const ul=sheet.querySelector('.catlist');
      ul.onclick=e=>{if(e.target.closest('.drag'))return;const li=e.target.closest('li[data-id]');if(li){editing=li.dataset.id;draw()}};
      const commit=()=>{const order=[...ul.children].map(x=>x.dataset.id);if(order.join()===S.cats.map(c=>c.id).join())return;S.cats=order.map(id=>S.cats.find(c=>c.id===id));save();render()};
      ul.addEventListener('pointerdown',e=>{
        const h=e.target.closest('.drag');if(!h)return;e.preventDefault();
        const li=h.closest('li');li.classList.add('dragging');
        const move=ev=>{const it=[...ul.children],i=it.indexOf(li),pv=it[i-1],nx=it[i+1];
          if(nx){const r=nx.getBoundingClientRect();if(ev.clientY>r.top+r.height/2){ul.insertBefore(nx,li);return}}
          if(pv){const r=pv.getBoundingClientRect();if(ev.clientY<r.top+r.height/2)ul.insertBefore(li,pv)}};
        const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);li.classList.remove('dragging');commit()};
        window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
      });
      ul.addEventListener('keydown',e=>{const h=e.target.closest('.drag');if(!h||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
        const li=h.closest('li');if(e.key==='ArrowUp'&&li.previousElementSibling)ul.insertBefore(li,li.previousElementSibling);else if(e.key==='ArrowDown'&&li.nextElementSibling)ul.insertBefore(li.nextElementSibling,li);h.focus();commit()});
      sheet.querySelector('#ctNew').onclick=()=>{editing='new';draw()};
    }
    sheet.querySelector('[data-close]').onclick=closeSheet;
  };
  draw();
}

/* ===== Nube: Firebase =====
   Cómo se guarda (para que nunca se pise ni se pierda nada):
   · finanzas/are-mau                  → fijos, pagos de cada ciclo, categorías, métodos y dólar (cada parte se actualiza por separado)
   · finanzas/are-mau/gastos/{id}      → cada gasto del día a día en su propio documento
   · finanzas/are-mau/respaldos/{ciclo} → copia de cada ciclo cuando se cierra */
const syncEl=document.getElementById('sync');
/* indicador: disquete verde = guardado; gris = guardando o sin conexión; rojo = problema */
const DISK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-2z"/><path d="M8 3v5h7V3"/><rect x="7.5" y="13" width="9" height="6" rx="1"/></svg>';
const DISK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-2z"/><path d="M3 3l18 18"/></svg>';
function setSync(cls,txt){
  syncEl.hidden=false;
  const busy=/Guardando|Conectando/.test(txt);
  syncEl.className='sync'+(cls?' '+cls:'')+(busy?' busy':'');
  syncEl.innerHTML=cls==='err'||/Sin conexión/.test(txt)?DISK_OFF:DISK;
  syncEl.title=txt;syncEl.setAttribute('aria-label',txt);
}
const CFG_FIELDS=['v','mv','fixed','cats','methods','fx','bill'];
const clean=o=>JSON.parse(JSON.stringify(o===undefined?null:o));
let fdb=null,root=null,gastosCol=null,cloudReady=false,remoteCfg=null,remoteEnts=null,base=null,seeding=false;
/* "base" = lo que la nube ya tiene; solo se sube lo que cambió respecto a eso */
function snapBase(cfg,ents){
  base={cfg:{},paid:{},ents:{}};
  CFG_FIELDS.forEach(f=>base.cfg[f]=JSON.stringify(cfg[f]===undefined?null:cfg[f]));
  Object.keys(cfg.paid||{}).forEach(k=>{if(cfg.paid[k]&&Object.keys(cfg.paid[k]).length)base.paid[k]=JSON.stringify(cfg.paid[k])});
  ents.forEach(e=>base.ents[e.id]=JSON.stringify(e));
}
function pushCloud(){
  if(!cloudReady||!base)return;
  const args=[],FP=firebase.firestore.FieldPath,del=firebase.firestore.FieldValue.delete();
  CFG_FIELDS.forEach(f=>{const j=JSON.stringify(S[f]===undefined?null:S[f]);if(j!==base.cfg[f]){args.push(new FP(f),clean(S[f]));base.cfg[f]=j}});
  new Set([...Object.keys(S.paid||{}),...Object.keys(base.paid)]).forEach(k=>{
    const cur=(S.paid||{})[k],j=cur&&Object.keys(cur).length?JSON.stringify(cur):undefined;
    if(j!==base.paid[k]){args.push(new FP('paid',k),j?clean(cur):del);if(j)base.paid[k]=j;else delete base.paid[k]}
  });
  const ops=[];
  if(args.length)ops.push(b=>b.update(root,...args));
  const ids=new Set(S.entries.map(e=>e.id));
  S.entries.forEach(e=>{const j=JSON.stringify(e);if(j!==base.ents[e.id]){const v=clean(e);ops.push(b=>b.set(gastosCol.doc(e.id),v));base.ents[e.id]=j}});
  Object.keys(base.ents).forEach(id=>{if(!ids.has(id)){ops.push(b=>b.delete(gastosCol.doc(id)));delete base.ents[id]}});
  if(!ops.length)return;
  setSync('off','Guardando…');
  const commits=[];for(let i=0;i<ops.length;i+=450){const b=fdb.batch();ops.slice(i,i+450).forEach(o=>o(b));commits.push(b.commit())}
  Promise.all(commits).then(()=>setSync('','Guardado')).catch(e=>{console.error(e);setSync('err','No se guardó')});
}
function hasData(x){return x&&((x.entries&&x.entries.length)||(x.fixed&&x.fixed.length))}
function mergeLocal(cloud,local){
  cloud.entries=cloud.entries||[];cloud.paid=cloud.paid||{};cloud.fixed=cloud.fixed||[];
  const ids=new Set(cloud.entries.map(e=>e.id));(local.entries||[]).forEach(e=>{if(!ids.has(e.id))cloud.entries.push(e)});
  cloud.cats=cloud.cats||[];const cids=new Set(cloud.cats.map(c=>c.id));(local.cats||[]).forEach(c=>{if(!cids.has(c.id))cloud.cats.push(c)});
  const fids=new Set(cloud.fixed.map(f=>f.id));(local.fixed||[]).forEach(f=>{if(!fids.has(f.id))cloud.fixed.push(f)});
  Object.keys(local.paid||{}).forEach(k=>{cloud.paid[k]=Object.assign({},local.paid[k],cloud.paid[k]||{})});
  return cloud;
}
function fromRemote(){const d=Object.assign({},remoteCfg);d.paid=Object.assign({},remoteCfg.paid||{});d.entries=remoteEnts.slice();return d}
function applyRemote(){
  if(!cloudReady||!remoteCfg||!remoteEnts)return;
  if(!sheet.hidden){pendingRemote=true;return}
  S=fromRemote();migrate();snapBase(remoteCfg,remoteEnts);
  lsSet(KEY,JSON.stringify(S));render();pushCloud();
}
function applyPending(){if(pendingRemote){pendingRemote=null;applyRemote()}}
function firstLink(){
  cloudReady=true;cloudRef=root;
  const linked=lsGet(KEY+'-cloud')==='1';lsSet(KEY+'-cloud','1');
  const local=S;
  snapBase(remoteCfg,remoteEnts);
  S=(!linked&&hasData(local))?mergeLocal(fromRemote(),local):fromRemote();
  migrate();lsSet(KEY,JSON.stringify(S));render();pushCloud();
  backupClosedCycle();
}
/* copia de seguridad del ciclo que se acaba de cerrar (una sola vez por ciclo) */
function backupClosedCycle(){
  const prev=keyAdd(realKey,-1);if(prev<START_KEY)return;
  const ref=root.collection('respaldos').doc(prev);
  ref.get({source:'server'}).then(s=>{if(s.exists)return;
    return ref.set(clean({ciclo:prev,guardado:new Date().toISOString(),gastos:entriesOf(prev),pagos:paidOf(prev),fijos:S.fixed,categorias:S.cats,metodos:S.methods,dolar:S.fx||null}));
  }).catch(e=>console.warn('respaldo',e));
}
(function initCloud(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.projectId||/PEGA/.test(cfg.projectId))return;
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
    fdb=firebase.firestore(app);
    fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    root=fdb.collection('finanzas').doc(window.FIREBASE_DOC||'are-mau');
    gastosCol=root.collection('gastos');
    setSync('off','Conectando…');
    const onErr=e=>{console.error(e);setSync('err','Sin acceso a la nube')};
    /* includeMetadataChanges: avisa también cuando el servidor confirma (si no, se queda en "Sin conexión") */
    root.onSnapshot({includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(!snap.exists){
        if(snap.metadata.fromCache){setSync('off','Sin conexión');return}
        /* nube vacía: se sube lo de este celular, con cada gasto aparte */
        if(seeding)return;seeding=true;
        const c=clean(S);delete c.entries;
        const b=fdb.batch();b.set(root,c);S.entries.slice(0,450).forEach(e=>b.set(gastosCol.doc(e.id),clean(e)));
        b.commit().catch(onErr);return;
      }
      const d=snap.data();
      if(Array.isArray(d.entries)){
        /* formato anterior (todo junto): cada gasto pasa a su propio documento, sin perder ninguno */
        const b=fdb.batch();d.entries.slice(0,450).forEach(e=>b.set(gastosCol.doc(e.id),clean(e)));
        b.update(root,{entries:firebase.firestore.FieldValue.delete()});b.commit().catch(onErr);return;
      }
      remoteCfg=d;
      if(!cloudReady){if(remoteEnts)firstLink()}else applyRemote();
      setSync(snap.metadata.fromCache?'off':'',snap.metadata.fromCache?'Sin conexión':'Guardado');
    },onErr);
    gastosCol.onSnapshot({includeMetadataChanges:true},qs=>{
      if(qs.metadata.hasPendingWrites)return;
      remoteEnts=qs.docs.map(x=>x.data());
      if(!cloudReady){if(remoteCfg)firstLink()}else applyRemote();
    },onErr);
  }catch(e){console.error(e);setSync('err','Error de nube')}
})();

/* descargar todo el historial en Excel (una hoja por tipo de dato) */
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=ko;document.head.appendChild(sc)});
}
const ownerName=id=>{const m=methOf(id);return m?(OWNERS.find(o=>o.id===m.owner)||{}).name||'':''};
const methName=id=>{const m=methOf(id);return m?m.name:''};
const cycName=k=>MESES[+k.slice(5)-1]+' '+k.slice(0,4);
function buildRows(){
  const gastos=[...S.entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const c=catOf(e.cat);return{
    'Fecha':e.date,'Ciclo':cycName(cycleOf(e.date)),'Categoría':c.name,'Nota':e.note||'',
    'Moneda':e.cur==='USD'?'Dólares':'Soles','Monto original':e.cur==='USD'?Number(e.orig):Number(e.amount),
    'Tipo de cambio':e.cur==='USD'?Number(e.rate):'','Monto en S/':Number(e.amount),
    'Método de pago':methName(e.method),'De':ownerName(e.method)}});
  const pagos=[];
  Object.keys(S.paid||{}).sort().forEach(k=>Object.keys(S.paid[k]||{}).forEach(id=>{const p=S.paid[k][id],f=S.fixed.find(x=>x.id===id);pagos.push({
    'Ciclo':cycName(k),'Gasto fijo':f?f.name:'(fijo eliminado)','Fecha de pago':p.date,
    'Moneda':p.cur==='USD'?'Dólares':'Soles','Monto original':p.cur==='USD'?Number(p.orig):Number(p.amount),
    'Tipo de cambio':p.cur==='USD'?Number(p.rate):'','Monto en S/':Number(p.amount),
    'Método de pago':methName(p.method),'De':ownerName(p.method)})}));
  const resumen=[];const keys=new Set([...S.entries.map(e=>cycleOf(e.date)),...Object.keys(S.paid||{})]);
  [...keys].sort().forEach(k=>resumen.push({'Ciclo':cycName(k),'Desde':startOf(k),'Hasta':endOf(k),'Fijos pagados S/':fixedPaid(k),'Día a día S/':varSpent(k),'Total S/':fixedPaid(k)+varSpent(k),'Gastos anotados':entriesOf(k).length}));
  const fijos=S.fixed.map(f=>({'Gasto fijo':f.name,'Moneda':f.cur==='USD'?'Dólares':'Soles','Monto mensual':Number(f.amount||0),'Cambia cada mes':f.variable?'Sí':'No','Método de pago':methName(f.method),'De':ownerName(f.method)}));
  const cats=S.cats.map(c=>({'Categoría':c.name,'Emoji':c.emoji}));
  return {resumen,gastos,pagos,fijos,cats};
}
async function downloadBackup(){
  toast('Preparando el Excel…');
  let X;try{X=await loadXLSX()}catch(e){toast('No se pudo preparar el Excel. Revisa tu conexión.');return}
  const r=buildRows(),wb=X.utils.book_new();
  const add=(rows,name,empty)=>{const ws=X.utils.json_to_sheet(rows.length?rows:[{[empty]:''}]);
    const cols=Object.keys(rows[0]||{[empty]:''});ws['!cols']=cols.map(k=>({wch:Math.max(k.length,...rows.map(x=>String(x[k]??'').length))+2}));
    X.utils.book_append_sheet(wb,ws,name)};
  add(r.resumen,'Resumen por ciclo','Sin datos todavía');
  add(r.gastos,'Día a día','Sin gastos todavía');
  add(r.pagos,'Fijos pagados','Sin pagos todavía');
  add(r.fijos,'Gastos fijos','Sin gastos fijos');
  add(r.cats,'Categorías','Sin categorías');
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  const filename='SuperFinance-casita-'+todayISO()+'.xlsx';
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename,data:blob});return}}catch(e){return}
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
    toast('✓ Excel descargado');
  }catch(e){toast('No se pudo descargar aquí')}
}

render();
refreshFx();

fromHash();window.addEventListener('hashchange',fromHash);
